# Example configuration for news-pilot.
# Copy to config.yaml and edit. Secrets are usually provided via .env:
#   LLM__API_KEY=..., TAVILY__API_KEY=..., TELEGRAM__BOT_TOKEN=..., DATABASE__DSN=...

log_level: INFO
data_dir: data

llm:
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o-mini"   # vision-capable
  temperature: 0.4
  timeout_seconds: 120
  retries: 3
  # extra_headers:                    # кастомные заголовки (шлюзы с сессионной авторизацией)
  #   x-opencode-session: "my-session-id"
  # api_key: set in .env (LLM__API_KEY)

embeddings:
  base_url: "http://localhost:11434"   # Ollama
  model: "qwen3-embedding:0.6b-q4_K_M"
  dimensions: 1024
  max_chars: 6000

rss:
  poll_interval_seconds: 300
  clear_run: false          # при запуске: все записи, уже лежащие в лентах, помечаются cleared и не обрабатываются
  feeds:
    - name: "lenta"
      url: "https://lenta.ru/rss"
    - name: "ria"
      url: "https://ria.ru/export/rss2/index.xml"
    # - name: "emulator"
    #   url: "http://host.docker.internal:8080/rss"

fetcher:
  timeout_seconds: 30
  retries: 2
  min_text_length: 100

# database:
#   dsn: задаётся в .env (DATABASE__DSN) — пользователь, пароль и база настраиваются там

tavily:
  # api_key: set in .env (TAVILY__API_KEY)
  timeout_seconds: 30
  retries: 3

telegram:
  # bot_token: set in .env (TELEGRAM__BOT_TOKEN)
  channel_id: "@channel"
  admin_id: 123456

dedup:
  window_days: 3
  min_similarity: 0.75
  top_k: 5
  on_error: review

photo_agent:
  max_iterations: 10
  max_searches: 5
  max_images: 4

context:
  window_days: 14
  top_k: 3
  min_similarity: 0.5

publish:
  mode: moderation        # auto | moderation
  moderation_timeout_hours: 24
  notify_admin: false     # в режиме auto — уведомлять админа о каждой публикации (ссылка, время, источник)
  append_source: false    # добавлять в конец поста ссылку на новость-источник
