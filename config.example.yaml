# Example configuration for news-pilot.
# Copy to config.yaml and edit. Secrets are usually provided via .env:
#   LLM__API_KEY=..., TAVILY__API_KEY=..., TELEGRAM__BOT_TOKEN=..., DATABASE__DSN=...

# Уровень логирования (DEBUG | INFO | WARNING | ERROR)
log_level: INFO

llm:                                  # генерация текста постов, вердикты дедупликации, фото-агент
  base_url: "https://polza.ai/api/v1"        # OpenAI-compatible endpoint
  model: "glm-5.3-flash"                     # vision-capable (нужны vision и tool-calling)
  temperature: 0.4                           # «творческость» генерации (0 = строго, 1 = свободно)
  timeout_seconds: 120                       # таймаут одного запроса к LLM
  retries: 3                                 # ретраев при ошибке/таймауте (с backoff)
  # proxy: "socks5://user:pass@host:1080"    # исходящий прокси для LLM-запросов (socks5:// / http://, пусто = напрямую)
  # extra_headers:                           # дополнительные HTTP-заголовки (шлюзы с сессионной авторизацией)
  #   x-opencode-session: "my-session-id"
  # reasoning_effort: "low"                  # уровень размышлений модели (low|medium|high; пусто = не отправлять)
  # extra_body:                              # сырой passthrough в тело запроса (например GLM-параметр thinking)
  #   thinking: {"type": "disabled"}         # полностью отключить размышления (если шлюз поддерживает)
  # api_key: задаётся в .env (LLM__API_KEY)

generator:                            # лимиты длины текста поста
  max_length: 500                           # максимум символов (лимит caption Telegram при фото ~1024 — выше поднимать нельзя)
  min_length: 200                           # минимум при пересжатии: короче — текст обрезается принудительно

embeddings:                           # эмбеддинги для дедупа и поиска связанных постов (Ollama)
  base_url: "http://localhost:11434"         # локальный Ollama
  model: "qwen3-embedding:0.6b"              # 0.6B: 1024 dims, ~1 ГБ RAM, быстрый (тега 0.6b-q4_K_M в реестре нет)
  dimensions: 1024                           # размерность вектора (зашита в схему БД, менять = пересоздать базу)
  max_chars: 3000                            # сколько символов текста подавать на эмбеддинг (title + text[:max_chars])
  # proxy: "socks5://user:pass@host:1080"    # прокси для доступа к Ollama (пусто = напрямую)

rss:                                  # сбор новостей из RSS-лент
  poll_interval_seconds: 120                 # интервал опроса всех фидов (сек)
  clear_run: true                            # при запуске всё, что уже в лентах, помечается cleared и не публикуется
  feeds:                                     # список лент: name — короткое имя источника (видно в админке), url — адрес RSS
    - name: "lenta"
      url: "https://lenta.ru/rss"
    - name: "ria"
      url: "https://ria.ru/export/rss2/index.xml"
    - name: "ria_world"
      url: "https://ria.ru/export/rss2/archive/index.xml"
#    - name: "tass"
#      url: "https://tass.ru/rss/v2.xml"
    - name: "interfax"
      url: "https://www.interfax.ru/rss.asp"
    - name: "kommersant"
      url: "https://www.kommersant.ru/RSS/news.xml"
    - name: "5tv"
      url: "https://www.5-tv.ru/news/rss/"
    - name: "rbc"
      url: "https://rssexport.rbc.ru/rbcnews/news/30/full.rss"
    - name: "vedomosti"
      url: "https://www.vedomosti.ru/rss/news"
    - name: "rt"
      url: "https://www.rt.com/rss/"

fetcher:                              # догрузка полного текста статьи по ссылке (и опрос RSS-лент)
  timeout_seconds: 30                        # таймаут загрузки страницы
  retries: 2                                 # ретраев при ошибке
  min_text_length: 100                       # текст короче (символов) → новость помечается failed
  # proxy: "socks5://user:pass@host:1080"    # прокси для RSS и догрузки статей (пусто = напрямую)

# database:
#   dsn: задаётся в .env (DATABASE__DSN) — пользователь, пароль и база настраиваются там

tavily:                               # поиск фото-кандидатов для фото-агента
  # api_key: задаётся в .env (TAVILY__API_KEY)
  timeout_seconds: 30                        # таймаут поискового запроса
  retries: 3                                 # ретраев при ошибке

telegram:                             # бот и канал
  # bot_token: задаётся в .env (TELEGRAM__BOT_TOKEN)
  channel_id: -1004491415188                 # канал публикации: @username или числовой id -100... (бот должен быть админом)
  admin_id: 7882141240                       # Telegram user id админа: модерация, уведомления, /admin
  # proxy: "socks5://user:pass@host:1080"    # прокси для Telegram Bot API (полезно из РФ, пусто = напрямую)

dedup:                                # отсев дубликатов: векторный поиск + LLM-вердикт (только «дубликат/не дубликат»)
  window_days: 3                             # искать дубли среди новостей за последние N дней
  min_similarity: 0.75                       # порог косинусной близости кандидатов (0..1)
  top_k: 5                                   # сколько ближайших новостей показывать LLM
  on_error: pass                             # при ошибке LLM: pass — считать уникальной, drop — отбросить

photo_agent:                          # подбор фото (tavily-поиск + vision-оценка)
  max_iterations: 10                         # максимум шагов tool-calling-цикла
  max_searches: 5                            # максимум поисковых запросов tavily на новость
  max_images: 2                              # максимум фото в посте (1–4)
  # proxy: "socks5://user:pass@host:1080"    # прокси для скачивания фото (пусто = напрямую)

context:                              # поиск связанных прошлых постов канала («как мы писали ранее»)
  window_days: 14                            # искать посты за последние N дней
  top_k: 3                                   # сколько ближайших постов подавать в контекст LLM
  min_similarity: 0.5                        # порог косинусной близости (0.7 режет ~60% релевантного)

pipeline:                             # дедуп-воркеры, интервал батч-отбора и ретраи записи
  concurrency: 4                             # сколько новостей параллельно проходит дедуп (каждая — отдельная async-задача; 8+ одновременно давит на CPU-ollama)
  batch_interval_seconds: 1800               # раз в сколько секунд очередь отбора выгребается под 0 и модель выбирает одну новость (1800 = 30 мин)
  retries: 2                                 # ретраев фазы записи (фото/контекст/генерация/публикация) после первой попытки

publish:                              # публикация в канал
  mode: auto                                 # auto — сразу в канал; moderation — черновик админу с кнопками
  moderation_timeout_hours: 24               # в режиме moderation: неотвеченный черновик отклоняется через N часов
  notify_admin: true                         # в режиме auto: уведомлять админа о каждой публикации (ссылка, время, источник)
  append_source: false                       # добавлять в конец поста ссылку «Источник» на исходную новость
  # Подпись в конце поста канала (HTML-ссылка): «{footer_text} <ссылка {footer_label}>».
  # Пустые значения = без подписи; пример: footer_text: "👉 Подпишись на", footer_label: "Info+", footer_url: "https://t.me/news_info_plus"
  footer_text: ""
  footer_label: ""
  footer_url: ""
  # proxy: "socks5://user:pass@host:1080"    # прокси для докачки фото при повторной публикации (пусто = напрямую)
