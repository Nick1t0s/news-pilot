services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ollama:
    image: ollama/ollama:latest
    profiles: ["optional"]
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"      # один слот: меньше RAM под KV-кэш (дефолт 4 → OOM-килл llama-server на маленьких серверах)
      OLLAMA_CONTEXT_LENGTH: "2048" # дефолтный num_ctx для эмбеддингов (максимум max_chars ≈ 3000 символов)
      OLLAMA_KEEP_ALIVE: "-1"       # модель всегда в памяти: без циклов load/unload
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  ollama:
